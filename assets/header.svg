<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Costa — AI research and engineering</title>
  <desc id="desc">An abstract geometric field connecting research, models, and evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1830"/>
      <stop offset="1" stop-color="#101328"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="80" x2="1160" y2="298" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.52" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 150) rotate(160) scale(430 260)">
      <stop stop-color="#7C3AED" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#A5B4FC" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>

  <g opacity="0.72">
    <path d="M796 280C873 209 890 99 976 88C1065 77 1093 199 1207 170" stroke="url(#accent)" stroke-width="1.5"/>
    <path d="M762 235C844 222 861 130 936 142C1007 153 1032 273 1172 255" stroke="url(#accent)" stroke-width="1.2" stroke-dasharray="5 8"/>
    <path d="M846 310L914 239L1002 268L1064 196L1168 228" stroke="url(#accent)" stroke-width="1.2"/>
    <circle cx="796" cy="280" r="6" fill="#5EEAD4"/>
    <circle cx="976" cy="88" r="7" fill="#60A5FA"/>
    <circle cx="1207" cy="170" r="6" fill="#C084FC"/>
    <circle cx="914" cy="239" r="5" fill="#67E8F9"/>
    <circle cx="1002" cy="268" r="5" fill="#818CF8"/>
    <circle cx="1064" cy="196" r="6" fill="#A78BFA"/>
    <circle cx="1168" cy="228" r="5" fill="#D8B4FE"/>
    <circle cx="976" cy="88" r="30" fill="#60A5FA" fill-opacity="0.16" filter="url(#blur)"/>
    <circle cx="1064" cy="196" r="34" fill="#A78BFA" fill-opacity="0.18" filter="url(#blur)"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="94" fill="#5EEAD4" font-size="15" font-weight="650" letter-spacing="3.5">RESEARCH · ENGINEERING · EVIDENCE</text>
    <text x="68" y="188" fill="#F8FAFC" font-size="72" font-weight="720" letter-spacing="-2.5">Gabriel Costa</text>
    <text x="72" y="236" fill="#CBD5E1" font-size="23" font-weight="420">Building rigorous ways to study intelligent systems.</text>
    <rect x="72" y="278" width="318" height="2" rx="1" fill="url(#accent)"/>
    <text x="72" y="312" fill="#94A3B8" font-size="15" font-weight="500" letter-spacing="1.3">CAUSALITY  /  REPRESENTATIONS  /  AGENTS</text>
  </g>
</svg>
